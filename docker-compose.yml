services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8000:8000"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    env_file:
      - .env
    environment:
      - IDS_EVIDENCE_DIR=/app/evidence
      - IDS_DASHBOARD_ORIGINS=*
      - INTERFACE_INDEX=any
    volumes:
      - evidence_data:/app/evidence
    command: >
      sh -c "python utils/live_ids.py & uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  evidence_data: